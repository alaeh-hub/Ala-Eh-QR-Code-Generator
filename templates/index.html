<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Ala Eh! QR Code Maker</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>
  <div id="splash" class="splash" aria-hidden="true"
    data-poster="{{ url_for('static', filename='img/alaeh-logo-3d-poster.png') }}">
    <div class="splash-stage">
      <div class="splash-glow"></div>
      <div class="splash-ring"></div>
      <video class="splash-video" autoplay muted playsinline preload="auto">
        <source src="{{ url_for('static', filename='video/alaeh-logo-3d.webm') }}" type="video/webm" />
        <source src="{{ url_for('static', filename='video/alaeh-logo-3d-black.mp4') }}" type="video/mp4" />
      </video>
    </div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById("splash");
      // Start at the top on every load so the coin lands on the big header logo,
      // and hold the page still while the intro plays.
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      document.documentElement.classList.add("splash-lock", "intro-hold");
      function unlock() { document.documentElement.classList.remove("splash-lock"); }
      // Page content waits behind the intro, then rises in as the coin flies to its spot.
      function release() { document.documentElement.classList.remove("intro-hold"); }
      setTimeout(release, 9000); // never leave the page hidden if something goes wrong
      var video = splash.querySelector("video");
      var done = false;
      var LOGO_FILL = 881 / 1080; // share of the video frame the round logo covers
      function fade() {
        unlock();
        release();
        splash.classList.add("is-hidden");
        setTimeout(function () { splash.remove(); }, 600);
      }
      // Land on the big header logo if it's on screen, else the navbar logo.
      function pickTarget() {
        var els = [document.querySelector(".app-icon"), document.querySelector(".navbar-logo")];
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (!el) continue;
          var r = el.getBoundingClientRect();
          var onScreen = r.width && r.top >= 0 && r.bottom <= window.innerHeight;
          if (onScreen && parseFloat(getComputedStyle(el).opacity) > 0.5) return el;
        }
        return null;
      }
      // Fly the coin along a gentle arc into the page logo. Halfway there it
      // cross-fades into an exact copy of that logo, so it lands pixel-perfect.
      var FLY_MS = 1400;
      var WINDUP = .14; // share of the flight spent gathering before launch
      function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
      function ease(t) { // quick launch, long glide into place
        return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      // Gold shockwave and sparks where the coin lands.
      function burst(r) {
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var ring = document.createElement("div");
        ring.className = "land-ring";
        ring.style.cssText = "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px";
        document.body.appendChild(ring);
        ring.animate([
          { transform: "scale(.9)", opacity: .95 },
          { transform: "scale(2.1)", opacity: 0 }
        ], { duration: 700, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = function () { ring.remove(); };
        for (var i = 0; i < 12; i++) {
          var s = document.createElement("span");
          s.className = "land-spark";
          s.style.cssText = "left:" + cx + "px;top:" + cy + "px";
          document.body.appendChild(s);
          var a = (i / 12) * Math.PI * 2 + Math.random() * .4;
          var dist = r.width * (.75 + Math.random() * .55);
          s.animate([
            { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
            { transform: "translate(calc(-50% + " + Math.cos(a) * dist + "px),calc(-50% + " + Math.sin(a) * dist + "px)) scale(0)", opacity: 0 }
          ], { duration: 520 + Math.random() * 260, easing: "cubic-bezier(.15,.8,.3,1)" }).onfinish = function () { this.effect.target.remove(); };
        }
      }
      function hide() {
        if (done) return;
        done = true;
        var target = pickTarget();
        if (!target || !video.animate) return fade();
        video.pause();
        splash.classList.add("is-settled"); // snap the entrance to its end state before measuring
        var t = target.getBoundingClientRect();
        var v = video.getBoundingClientRect();
        if (!t.width || !v.width) return fade();

        var vc = { x: v.left + v.width / 2, y: v.top + v.height / 2 };
        var tc = { x: t.left + t.width / 2, y: t.top + t.height / 2 };
        var d0 = v.width * LOGO_FILL, d1 = t.width; // visible coin diameter, start and end
        // Bend the path: pull the control point sideways so it swoops rather than slides.
        var mx = (vc.x + tc.x) / 2, my = (vc.y + tc.y) / 2;
        var nx = -(tc.y - vc.y) * 0.22, ny = (tc.x - vc.x) * 0.22;
        var k = { x: mx + nx, y: my + ny };

        // A copy of the page logo, laid out exactly where the real one is.
        var twin = new Image();
        twin.src = target.currentSrc || target.src;
        twin.alt = "";
        twin.className = "splash-twin";
        twin.style.cssText = "left:" + t.left + "px;top:" + t.top + "px;width:" + t.width + "px;height:" + t.height + "px;filter:" + getComputedStyle(target).filter;
        splash.appendChild(twin);

        // Which way the coin travels, for banking into the turn like it's thrown.
        var dx = tc.x - vc.x, dy = tc.y - vc.y, dl = Math.hypot(dx, dy) || 1;
        dx /= dl; dy /= dl;

        // Sample the motion densely and play it back linearly, so every frame is on the curve.
        var vFrames = [], tFrames = [], N = 120;
        for (var i = 0; i <= N; i++) {
          var p = i / N;
          var e = ease(clamp01((p - WINDUP) / (1 - WINDUP))), u = 1 - e;
          var cx = u * u * vc.x + 2 * u * e * k.x + e * e * tc.x;
          var cy = u * u * vc.y + 2 * u * e * k.y + e * e * tc.y;
          var dia = Math.exp(Math.log(d0) + (Math.log(d1) - Math.log(d0)) * e); // scale evenly, not linearly
          // Wind-up: swell a little and dip back before launching.
          var w = Math.sin(Math.PI * clamp01(p / WINDUP));
          var pull = p < WINDUP ? w * .07 : 0;
          // Landing thud: a small squash just before touchdown, settling exactly at 1.
          var land = Math.sin(Math.PI * clamp01((p - .84) / .16));
          var sc = (1 + pull - land * .09);
          var bank = Math.sin(Math.PI * e) * 26; // degrees of tilt mid-flight
          var tilt = "perspective(900px) rotateX(" + (-dy * bank) + "deg) rotateY(" + (dx * bank) + "deg) rotateZ(" + (dx * bank * .35) + "deg)";
          var back = p < WINDUP ? -w * 14 : 0; // pulled back away from the target
          var ox = cx + dx * back, oy = cy + dy * back;
          var mix = clamp01((e - .5) / .35); // coin -> logo cross-fade
          vFrames.push({ transform: "translate(" + (ox - vc.x) + "px," + (oy - vc.y) + "px) " + tilt + " scale(" + dia / d0 * sc + ")", opacity: 1 - mix });
          tFrames.push({ transform: "translate(" + (ox - tc.x) + "px," + (oy - tc.y) + "px) " + tilt + " scale(" + dia / d1 * sc + ")", opacity: mix });
        }
        target.style.visibility = "hidden";
        splash.classList.add("is-flying");
        release();
        video.style.clipPath = "circle(" + (LOGO_FILL * 50) + "% at 50% 50%)";
        var opts = { duration: FLY_MS, easing: "linear", fill: "forwards" };
        video.animate(vFrames, opts);
        twin.animate(tFrames, opts).onfinish = function () {
          // The twin sits exactly on the real logo now; swap them in the same frame.
          target.style.visibility = "";
          splash.remove();
          unlock();
          burst(t);
          target.animate([
            { transform: "scale(1)", filter: getComputedStyle(target).filter },
            { transform: "scale(1.1)", filter: "drop-shadow(0 0 18px rgba(255, 214, 10, .75)) brightness(1.15)", offset: .3 },
            { transform: "scale(.98)", offset: .65 },
            { transform: "scale(1)", filter: getComputedStyle(target).filter }
          ], { duration: 620, easing: "cubic-bezier(.3,.7,.4,1)" });
        };
      }
      // The header logo is rendered by React; give it a moment to mount.
      function hideWhenReady() {
        var tries = 0;
        (function wait() {
          if (document.querySelector(".app-icon") || tries++ > 20) hide();
          else setTimeout(wait, 50);
        })();
      }
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        video.removeAttribute("autoplay");
        video.pause();
        video.poster = splash.dataset.poster;
        splash.classList.add("is-playing", "is-settled");
        setTimeout(function () { done = true; fade(); }, 900);
        return;
      }
      function bail() { if (!done) { done = true; fade(); } }
      // Start the entrance only once frames are actually moving, so nothing pops in.
      video.addEventListener("playing", function () { splash.classList.add("is-playing"); }, { once: true });
      // Pulse a ring of light when the coin turns face-front (~2.3s into the video).
      video.addEventListener("timeupdate", function landed() {
        if (video.currentTime < 2.2) return;
        splash.classList.add("is-landed");
        video.removeEventListener("timeupdate", landed);
      });
      video.addEventListener("ended", hideWhenReady);
      video.addEventListener("error", bail, true);
      splash.addEventListener("click", hideWhenReady);
      var p = video.play();
      if (p && p.catch) p.catch(function () { setTimeout(bail, 1200); });
      setTimeout(hideWhenReady, 7000); // safety net if the video stalls
    })();
  </script>

  <div id="root">
    <div class="boot" aria-label="Loading">
      <img src="{{ url_for('static', filename='img/alaeh-logo-3d-poster.png') }}" alt="" />
    </div>
  </div>

  <script>window.LOGO_URL = "{{ url_for('static', filename='img/alaeh-logo-3d-poster.png') }}";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="{{ url_for('static', filename='js/app.jsx') }}"></script>
</body>

</html>
